<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Парикмахерская{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="page-header">
        <div class="content header-content">
            <h1>Управление парикмахерской</h1>
        </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <section class="messages content">
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-dock">
        <div class="footer-dock__inner">
            <a class="dock-item" href="#salon-space" aria-label="Перейти к пространству салона">
                <span class="dock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 21v-5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"/>
                        <path d="M8 14V7.5a4 4 0 1 1 8 0V14"/>
                        <path d="M6 21h12"/>
                    </svg>
                </span>
                <span class="dock-label">Зал</span>
            </a>
            <a class="dock-item" href="#people-space" aria-label="Перейти к клиентам">
                <span class="dock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
                        <circle cx="9.5" cy="7" r="4"/>
                        <path d="M20 8v6"/>
                        <path d="M23 11h-6"/>
                    </svg>
                </span>
                <span class="dock-label">Клиенты</span>
            </a>
            <a class="dock-item" href="#people-space" aria-label="Перейти к мастерам">
                <span class="dock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="7" r="4"/>
                        <path d="M2 21a6 6 0 0 1 12 0"/>
                        <path d="M16 3l5 5"/>
                        <path d="M21 3l-5 5"/>
                    </svg>
                </span>
                <span class="dock-label">Мастера</span>
            </a>
            <a class="dock-item" href="#booking-section" aria-label="Перейти к записям">
                <span class="dock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <path d="M16 2v4"/>
                        <path d="M8 2v4"/>
                        <path d="M3 10h18"/>
                    </svg>
                </span>
                <span class="dock-label">Записи</span>
            </a>
            <a class="dock-item" href="#workflow-section" aria-label="Перейти к оплате">
                <span class="dock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                        <path d="M2 10h20"/>
                        <path d="M16 15h2"/>
                    </svg>
                </span>
                <span class="dock-label">Оплата</span>
            </a>
        </div>
    </footer>
</body>
</html>
